<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>タスク管理ツール</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>タスク管理ツール</h1>
      <button id="themeToggle" class="icon-btn" title="テーマ切替" aria-label="テーマ切替">🌓</button>
    </header>

    <section class="stats" id="stats">
      <div class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">全タスク</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statActive">0</span>
        <span class="stat-label">未完了</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statDone">0</span>
        <span class="stat-label">完了</span>
      </div>
      <div class="stat-card" id="statOverdueCard">
        <span class="stat-value" id="statOverdue">0</span>
        <span class="stat-label">期限超過</span>
      </div>
    </section>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskTitle" placeholder="タスク名を入力…" required maxlength="200" />
      <input type="date" id="taskDue" />
      <select id="taskPriority">
        <option value="low">低</option>
        <option value="medium" selected>中</option>
        <option value="high">高</option>
      </select>
      <input type="text" id="taskCategory" placeholder="カテゴリ（任意）" maxlength="40" />
      <button type="submit" class="primary-btn">追加</button>
    </form>

    <section class="toolbar">
      <div class="filter-group" id="filterStatus">
        <button data-filter="all" class="filter-btn active">すべて</button>
        <button data-filter="active" class="filter-btn">未完了</button>
        <button data-filter="done" class="filter-btn">完了</button>
      </div>
      <input type="search" id="searchInput" placeholder="検索…" />
      <select id="sortSelect">
        <option value="created">作成日順</option>
        <option value="due">期限順</option>
        <option value="priority">優先度順</option>
      </select>
    </section>

    <ul id="taskList" class="task-list"></ul>
    <p id="emptyState" class="empty-state" hidden>タスクがありません。上のフォームから追加してください。</p>
  </div>

  <template id="taskItemTemplate">
    <li class="task-item" draggable="true">
      <label class="task-check">
        <input type="checkbox" class="task-done-checkbox" />
        <span class="checkmark"></span>
      </label>
      <div class="task-body">
        <div class="task-title-row">
          <span class="task-title"></span>
          <span class="priority-badge"></span>
        </div>
        <div class="task-meta">
          <span class="task-category"></span>
          <span class="task-due"></span>
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn edit-btn" title="編集">✏️</button>
        <button class="icon-btn delete-btn" title="削除">🗑️</button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
