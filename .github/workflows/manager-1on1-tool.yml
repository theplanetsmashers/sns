name: 1on1 Tool From Issue

on:
  issues:
    types: [opened]

jobs:
  handle:
    # リポジトリの持ち主が開いた、1on1支援ツール向けラベル付きのIssueだけを処理する
    if: |
      github.event.issue.user.login == github.repository_owner &&
      (
        contains(github.event.issue.labels.*.name, '1on1-register') ||
        contains(github.event.issue.labels.*.name, '1on1-agenda') ||
        contains(github.event.issue.labels.*.name, '1on1-log') ||
        contains(github.event.issue.labels.*.name, '1on1-trend')
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run 1on1 bot
        working-directory: manager-1on1-tool
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: node bot.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manager-1on1-tool/state/subordinates.json manager-1on1-tool/state/logs.json
          git diff --staged --quiet || git commit -m "chore: update 1on1 tool state (issue #${{ github.event.issue.number }})"
          git push
