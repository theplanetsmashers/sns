name: Comment Draft From Issue

# 一時停止中(2026-09-12): 売上が立つまでClaude APIの自動呼び出しを止めています。
# 再開する場合は、下のissuesトリガーのコメントアウトを外してください。
on:
  # issues:
  #   types: [opened]
  workflow_dispatch: {} # Actionsタブに表示するためのダミートリガー(Issueが無いと実行しても動作しない)

jobs:
  generate:
    # リポジトリの持ち主が、このテンプレート由来のIssueを開いた場合だけ処理する
    # (公開リポジトリでの悪用/API消費を防ぐのと、他のIssueテンプレートとの誤反応を防ぐため)
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[コメント案]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate comment drafts
        working-directory: comment-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node bot.js

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add comment-generator/state/history.json
          git diff --staged --quiet || git commit -m "chore: update comment history (issue #${{ github.event.issue.number }})"
          git push
