name: Test tacit-knowledge-interview-bot

on:
  push:
    paths:
      - "tacit-knowledge-interview-bot/**"
  pull_request:
    paths:
      - "tacit-knowledge-interview-bot/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacit-knowledge-interview-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
