name: Note SNS Draft Generator

on:
  push:
    paths:
      - "articles/**.md"
  workflow_dispatch:
    inputs:
      article_path:
        description: "処理するnote記事ファイルのパス(空欄なら今回のpushで追加・変更された記事、または articles/ の全ファイルを処理)"
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine article files to process
        id: changed
        env:
          ARTICLE_PATH_INPUT: ${{ inputs.article_path }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$ARTICLE_PATH_INPUT" ]; then
            echo "files=$ARTICLE_PATH_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=""
          if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=ACM "$EVENT_BEFORE" "${{ github.sha }}" -- 'articles/*.md' | tr '\n' ' ')
          fi

          # 差分が取れない(手動実行 / 最初のpush等)場合は articles/ 配下の全記事を対象にする
          if [ -z "$FILES" ]; then
            FILES=$(ls articles/*.md 2>/dev/null | tr '\n' ' ')
          fi

          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Generate SNS drafts
        if: steps.changed.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node generate-sns-drafts.js ${{ steps.changed.outputs.files }}
