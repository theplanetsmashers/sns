name: Educational Material Generator From Issue

on:
  issues:
    types: [opened]

jobs:
  generate:
    # リポジトリの持ち主が、このテンプレート由来のIssueを開いた場合だけ処理する
    # (ラベルはリポジトリに未登録だと自動付与されないため、テンプレート固定のタイトルで判定する)
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[教材生成]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    # VOICEVOX(無料の日本語音声合成エンジン)をサイドカーコンテナとして起動する。
    # APIキー不要・無料でナレーション音声を生成するための仕組み。
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: edu-material-generator
        run: npm ci

      - name: Wait for VOICEVOX engine
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:50021/version > /dev/null 2>&1; then
              echo "VOICEVOX is ready"
              exit 0
            fi
            echo "waiting for VOICEVOX... ($i)"
            sleep 5
          done
          echo "VOICEVOX did not become ready in time (音声はナレーションなしで続行されます)"

      - name: Generate course materials
        id: generate
        working-directory: edu-material-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICEVOX_URL: http://localhost:50021
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node bot.js

      - name: Upload generated materials
        if: always() && steps.generate.outputs.outdir != ''
        uses: actions/upload-artifact@v4
        with:
          name: "edu-material-issue-${{ github.event.issue.number }}"
          path: ${{ steps.generate.outputs.outdir }}
          retention-days: 30

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add edu-material-generator/state/history.json
          git diff --staged --quiet || git commit -m "chore: update edu material history (issue #${{ github.event.issue.number }})"
          git push
