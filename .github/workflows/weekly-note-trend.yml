name: Weekly Note Trend Report

on:
  schedule:
    # 毎週月曜 21:00 UTC = 日本時間 火曜6:00 に実行(必要に応じて時刻を調整してください)
    - cron: "0 21 * * 1"
  workflow_dispatch: {} # 手動実行用ボタンをGitHub上に表示する

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # state/ 配下の履歴・レポートをコミットし直すために必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: note-trend-generator
        run: npm ci

      - name: Generate trend report
        working-directory: note-trend-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node generate-trend-report.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add note-trend-generator/state/
          git diff --staged --quiet || git commit -m "chore: update note trend report $(date -u +%Y-%m-%d)"
          git push
