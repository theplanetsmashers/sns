name: Sync Note Articles from Google Drive

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 7:00 に実行(必要に応じて時刻を調整してください)
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 手動実行用ボタンをGitHub上に表示する

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # state/published-articles.json をコミットし直すために必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync published articles from Google Drive
        working-directory: note-trend-generator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_NOTE_FOLDER_ID: "19ZN1_DXesucSqsSaAOHVU1pY9aRbdVcz"
        run: node sync-drive-articles.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add note-trend-generator/state/published-articles.json
          git diff --staged --quiet || git commit -m "chore: sync note articles from Google Drive $(date -u +%Y-%m-%d)"
          git push
