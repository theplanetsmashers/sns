name: "[1on1] 部下登録"
description: 1on1支援ツールに部下・委任先チームリーダーを登録します
title: "[1on1登録] "
labels: ["1on1-register"]
body:
  - type: input
    id: name
    attributes:
      label: 名前
      placeholder: "例: 山田さん"
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: 役割(任意)
      placeholder: "例: 営業担当"
    validations:
      required: false
  - type: input
    id: years
    attributes:
      label: 経験年数(任意)
      placeholder: "例: 3年"
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: 関係
      description: 直属部下と委任先チームリーダーでは、1on1準備で重視する観点が変わります
      options:
        - 直属部下
        - 委任先チームリーダー
      default: 0
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: メモ(任意)
      placeholder: 性格や背景など、判断の参考になること
    validations:
      required: false
