name: "[1on1] 後記録(要点抽出)"
description: 1on1後のメモから要点・判断基準・次回フォローをAIが抽出して記録します
title: "[1on1記録] "
labels: ["1on1-log"]
body:
  - type: input
    id: target
    attributes:
      label: 対象
      description: 登録時の「名前」と同じ表記で入力してください
      placeholder: "例: 山田さん"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 実施日(任意)
      description: "未入力の場合は今日の日付になります(YYYY-MM-DD)"
      placeholder: "2026-09-06"
    validations:
      required: false
  - type: textarea
    id: memo
    attributes:
      label: 1on1メモ
      description: 話した内容をそのまま貼り付けてください。箇条書きでも文章でも構いません
      placeholder: 1on1で話した内容をそのまま貼り付け
    validations:
      required: true
